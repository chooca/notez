<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notez - Secure Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Outfit for a modern tech feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030005; /* Deep black/purple */
            --card-bg-1: #0e0725;
            --card-bg-2: #05020a;
            --panel-bg-1: #110a26;
            --panel-bg-2: #0a0616;
            --item-bg: #1a103c;
            --item-hover: #251754;
            --accent-glow: 0 0 15px rgba(217, 70, 239, 0.4);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color);
        }
        
        h1, h2, h3, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        /* Custom Dark Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a1a5c; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a2f9c; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Tag Checkbox Styling */
        .tag-checkbox:checked + label { 
            background: linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899);
            color: white; 
            border-color: transparent;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }

        /* Input overrides for dark mode */
        input:focus, select:focus, textarea:focus {
            outline: none;
        }
        select option {
            background-color: var(--panel-bg-1);
            color: white;
        }

        /* Loading Spinner */
        .loader { border-top-color: #ec4899; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Neumorphic/Glow Cards */
        .dashboard-card {
            background: linear-gradient(145deg, var(--card-bg-1), var(--card-bg-2));
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            border-radius: 32px;
        }
        
        .sidebar-card {
            background: linear-gradient(180deg, var(--panel-bg-1), var(--panel-bg-2));
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            border-radius: 32px;
        }

        .neon-text {
            background: linear-gradient(to right, #60a5fa, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-gray-300 h-screen overflow-hidden flex flex-col md:flex-row p-2 md:p-4 gap-4">

    <!-- MODAL BACKDROP -->
    <div id="modalBackdrop" class="fixed inset-0 bg-black bg-opacity-90 z-50 flex justify-center items-center backdrop-blur-sm">
        
        <!-- Password Modal (Init) -->
        <div id="passwordModal" class="dashboard-card p-8 max-w-md w-full mx-4 border border-[#2a1a5c] relative overflow-hidden transition-transform transform scale-100">
            <!-- Decorative blur -->
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-purple-600 rounded-full mix-blend-screen filter blur-[80px] opacity-50"></div>
            
            <div class="text-center mb-8 relative z-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#1a103c] text-fuchsia-400 mb-4 shadow-[0_0_20px_rgba(217,70,239,0.3)]">
                    <i class="fas fa-lock text-3xl"></i>
                </div>
                <h2 id="modalTitle" class="text-3xl font-bold font-heading text-white tracking-wide">Welcome</h2>
                <p id="modalDesc" class="text-gray-400 mt-2 text-sm">Secure, encrypted local storage.</p>
            </div>
            <form id="passwordForm" class="space-y-6 relative z-10">
                <div>
                    <input type="password" id="masterPassword" required
                        class="w-full px-5 py-4 rounded-2xl bg-[#0a0616] border border-[#2a1a5c] text-white focus:border-fuchsia-500 focus:shadow-[0_0_15px_rgba(217,70,239,0.2)] transition-all placeholder-gray-600"
                        placeholder="Master Password">
                </div>
                <div id="passwordError" class="text-pink-500 text-sm hidden text-center font-medium">Incorrect password. Please try again.</div>
                <button type="submit" id="passwordSubmitBtn" class="w-full bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all flex items-center justify-center tracking-wider">
                    <span id="btnText">UNLOCK</span>
                    <div id="btnLoader" class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 ml-2 hidden"></div>
                </button>
            </form>
        </div>

        <!-- Confirm Modal (Generic) -->
        <div id="confirmModal" class="dashboard-card p-8 max-w-md w-full mx-4 border border-[#2a1a5c] hidden">
            <h2 id="confirmTitle" class="text-2xl font-bold font-heading text-white mb-2">Confirm</h2>
            <p id="confirmDesc" class="text-gray-400 mb-8">Are you sure?</p>
            <div class="flex justify-end space-x-4">
                <button id="confirmCancel" class="px-6 py-3 bg-[#1a103c] hover:bg-[#251754] rounded-xl text-gray-300 transition-colors font-medium">Cancel</button>
                <button id="confirmAction" class="px-6 py-3 bg-gradient-to-r from-pink-600 to-red-600 hover:opacity-90 shadow-[0_0_15px_rgba(225,29,72,0.4)] rounded-xl text-white transition-all font-bold tracking-wide">Confirm</button>
            </div>
        </div>
    </div>

    <!-- SIDEBAR (Notes List) -->
    <div id="sidebar" class="sidebar-card w-full md:w-[380px] flex flex-col h-full z-10 relative transition-transform border border-white/5 border-t-white/10">
        
        <!-- Header -->
        <div class="p-6 pb-4 flex justify-between items-center">
            <h1 class="text-3xl font-bold font-heading neon-text flex items-center gap-3">
                <i class="fas fa-heartbeat text-pink-500 drop-shadow-[0_0_8px_rgba(236,72,153,0.8)]"></i> Notez
            </h1>
            <div class="flex gap-2">
                <button onclick="triggerImport()" class="w-10 h-10 flex justify-center items-center text-gray-400 hover:text-blue-400 hover:bg-[#1a103c] rounded-full transition-all" title="Import JSON">
                    <i class="fas fa-file-import"></i>
                </button>
                <button onclick="exportData()" class="w-10 h-10 flex justify-center items-center text-gray-400 hover:text-fuchsia-400 hover:bg-[#1a103c] rounded-full transition-all" title="Export JSON">
                    <i class="fas fa-file-export"></i>
                </button>
                <button onclick="confirmWipe()" class="w-10 h-10 flex justify-center items-center text-gray-400 hover:text-red-400 hover:bg-[#1a103c] rounded-full transition-all" title="Wipe All">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImport(event)">
        </div>

        <!-- Search & Filter -->
        <div class="px-6 pb-4">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-3.5 text-gray-500"></i>
                <input type="text" id="searchInput" placeholder="Search notes..." 
                    class="w-full pl-12 pr-4 py-3 bg-[#0a0616] border border-[#2a1a5c] text-white rounded-2xl focus:border-fuchsia-500 focus:shadow-[0_0_10px_rgba(217,70,239,0.2)] transition-all placeholder-gray-600 text-sm">
            </div>
            
            <!-- Filters & Sorting Dropdowns -->
            <div class="mt-4 flex gap-3">
                <div class="relative flex-1">
                    <select id="filterCategory" class="w-full p-3 pl-4 pr-8 bg-[#0a0616] border border-[#2a1a5c] text-gray-300 rounded-xl focus:border-blue-500 focus:shadow-[0_0_10px_rgba(59,130,246,0.2)] transition-all text-xs appearance-none cursor-pointer">
                        <option value="">All Tags</option>
                        <!-- Options generated dynamically -->
                    </select>
                    <i class="fas fa-chevron-down absolute right-3 top-3.5 text-gray-600 pointer-events-none text-xs"></i>
                </div>

                <div class="relative flex-1">
                    <select id="sortOrder" class="w-full p-3 pl-4 pr-8 bg-[#0a0616] border border-[#2a1a5c] text-gray-300 rounded-xl focus:border-blue-500 focus:shadow-[0_0_10px_rgba(59,130,246,0.2)] transition-all text-xs appearance-none cursor-pointer">
                        <option value="date-desc">Newest</option>
                        <option value="date-asc">Oldest</option>
                        <option value="priority-desc">High Priority</option>
                        <option value="priority-asc">Low Priority</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-3 top-3.5 text-gray-600 pointer-events-none text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Notes List -->
        <div id="notesList" class="flex-1 overflow-y-auto px-4 pb-2 space-y-3">
            <!-- Populated by JS -->
        </div>

        <!-- Add Button -->
        <div class="p-6 pt-4">
            <button onclick="createNewNote()" class="w-full bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all flex items-center justify-center gap-3 tracking-wide">
                <i class="fas fa-plus-circle text-xl"></i> Create Note
            </button>
        </div>
    </div>

    <!-- MAIN EDITOR -->
    <div id="editorPanel" class="dashboard-card hidden md:flex flex-1 flex-col h-full relative border border-white/5 border-t-white/10 overflow-hidden">
        <!-- Abstract Background Glows -->
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-blue-900/10 to-transparent pointer-events-none"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-fuchsia-900/20 rounded-full filter blur-[100px] pointer-events-none"></div>

        <!-- Mobile Header (Back button) -->
        <div class="md:hidden flex items-center p-4 border-b border-[#2a1a5c] relative z-10">
            <button onclick="closeMobileEditor()" class="text-gray-400 hover:text-white flex items-center gap-2 font-medium bg-[#1a103c] px-4 py-2 rounded-xl">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-gray-500 p-8 text-center relative z-10">
            <div class="w-32 h-32 mb-6 rounded-full bg-[#0a0616] border border-[#2a1a5c] flex items-center justify-center shadow-[0_0_30px_rgba(0,0,0,0.5)] relative">
                <div class="absolute inset-0 rounded-full border border-fuchsia-500/20 animate-ping"></div>
                <i class="fas fa-wave-square text-5xl text-[#2a1a5c]"></i>
            </div>
            <h3 class="text-2xl font-bold font-heading text-white tracking-wide">Dashboard Ready</h3>
            <p class="mt-3 max-w-sm text-gray-400">Select a recording from the panel or initiate a new trace.</p>
        </div>

        <!-- Active Editor -->
        <div id="activeEditor" class="hidden flex-1 flex flex-col h-full relative z-10">
            
            <!-- Editor Toolbar -->
            <div class="px-8 py-5 border-b border-white/5 flex justify-between items-center gap-4">
                <div class="flex items-center gap-6">
                    <!-- Importance -->
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Status</span>
                        <div class="flex bg-[#0a0616] rounded-xl p-1 border border-[#2a1a5c]">
                            <button onclick="setImportance(1)" id="btnImp1" class="px-4 py-1.5 rounded-lg text-gray-500 hover:text-white transition-all text-xs font-bold tracking-wide">LOW</button>
                            <button onclick="setImportance(2)" id="btnImp2" class="px-4 py-1.5 rounded-lg text-gray-500 hover:text-white transition-all text-xs font-bold tracking-wide">MED</button>
                            <button onclick="setImportance(3)" id="btnImp3" class="px-4 py-1.5 rounded-lg text-gray-500 hover:text-white transition-all text-xs font-bold tracking-wide">HIGH</button>
                        </div>
                    </div>

                    <!-- Auto-save status -->
                    <div id="saveStatus" class="text-xs font-medium text-gray-500 flex items-center gap-2 bg-[#0a0616] px-3 py-1.5 rounded-xl border border-white/5">
                        <i class="fas fa-check-circle text-green-500 drop-shadow-[0_0_5px_rgba(34,197,94,0.5)]"></i> Synced
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="deleteActiveNote()" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-red-500 hover:bg-[#1a103c] rounded-xl transition-all shadow-sm border border-transparent hover:border-red-900/50" title="Delete Trace">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <!-- Editor Title & Meta -->
            <div class="px-8 md:px-12 pt-10 pb-6 flex-shrink-0">
                <input type="text" id="noteTitle" placeholder="Enter Title..." 
                    class="w-full text-4xl md:text-5xl font-bold font-heading text-white placeholder-gray-700 bg-transparent border-none p-0 focus:ring-0 mb-6 drop-shadow-md">
                
                <div class="flex items-center gap-4 text-sm text-gray-400 mb-8">
                    <span id="noteDates" class="flex items-center gap-2 bg-[#0a0616] px-3 py-1.5 rounded-lg border border-white/5"><i class="far fa-clock text-blue-400"></i> Logged...</span>
                </div>

                <!-- Tags Selection -->
                <div class="flex flex-wrap gap-2.5" id="tagsContainer">
                    <!-- Generated via JS -->
                </div>
            </div>

            <!-- Editor Content -->
            <div class="flex-1 px-8 md:px-12 pb-12 overflow-y-auto">
                <textarea id="noteContent" placeholder="Begin analysis recording..." 
                    class="w-full h-full min-h-[300px] text-gray-300 text-lg leading-relaxed bg-transparent border-none p-0 focus:ring-0 resize-none placeholder-gray-700"></textarea>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-[#110a26] border border-[#3b2775] text-white px-6 py-4 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] transform transition-all duration-300 translate-y-20 opacity-0 z-50 flex items-center gap-4 min-w-[300px]">
        <div id="toastIconContainer" class="w-10 h-10 rounded-full flex items-center justify-center bg-[#1a103c]">
            <i id="toastIcon" class="fas fa-info-circle text-blue-400"></i>
        </div>
        <span id="toastMsg" class="font-medium tracking-wide">Notification</span>
    </div>

    <script>
        // --- CONSTANTS & STATE ---
        const DEFAULT_CATEGORIES = ["links", "ideas", "recipes", "vocabulary", "private", "work", "reminder", "tasks"];
        const STORAGE_KEY = 'notez_encrypted_data';
        
        let notes = [];
        let allKnownTags = [...DEFAULT_CATEGORIES];
        let activeNoteId = null;
        let masterPassword = null;
        let searchTimeout = null;
        let saveTimeout = null;
        let isSaving = false;

        // --- CRYPTOGRAPHY UTILITIES (AES-GCM) ---
        const cryptoUtils = {
            generateSalt: () => window.crypto.getRandomValues(new Uint8Array(16)),
            generateIv: () => window.crypto.getRandomValues(new Uint8Array(12)),
            
            deriveKey: async (password, salt) => {
                const enc = new TextEncoder();
                const keyMaterial = await window.crypto.subtle.importKey(
                    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
                );
                return window.crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
                );
            },
            
            encryptData: async (data, password) => {
                const salt = cryptoUtils.generateSalt();
                const iv = cryptoUtils.generateIv();
                const key = await cryptoUtils.deriveKey(password, salt);
                const enc = new TextEncoder();
                
                const encryptedContent = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv }, key, enc.encode(JSON.stringify(data))
                );
                
                return {
                    salt: Array.from(salt),
                    iv: Array.from(iv),
                    data: Array.from(new Uint8Array(encryptedContent))
                };
            },
            
            decryptData: async (encryptedObj, password) => {
                const salt = new Uint8Array(encryptedObj.salt);
                const iv = new Uint8Array(encryptedObj.iv);
                const data = new Uint8Array(encryptedObj.data);
                
                const key = await cryptoUtils.deriveKey(password, salt);
                
                const decryptedContent = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv }, key, data
                );
                
                const dec = new TextDecoder();
                return JSON.parse(dec.decode(decryptedContent));
            }
        };

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupEventListeners();
            buildTagsUI();
        });

        function checkAuth() {
            const hasData = localStorage.getItem(STORAGE_KEY);
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const btnText = document.getElementById('btnText');
            
            if (hasData) {
                title.innerText = 'System Locked';
                desc.innerText = 'Enter master key to decrypt dashboard data.';
                btnText.innerText = 'DECRYPT & ENTER';
            } else {
                title.innerText = 'Initialize System';
                desc.innerText = 'Create a master key to secure your dashboard.';
                btnText.innerText = 'SECURE & START';
            }
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            document.getElementById('passwordForm').addEventListener('submit', handleLogin);
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => renderNotesList(), 300);
            });
            document.getElementById('filterCategory').addEventListener('change', renderNotesList);
            document.getElementById('sortOrder').addEventListener('change', renderNotesList);

            const inputs = ['noteTitle', 'noteContent'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', scheduleSave);
            });
        }

        // --- AUTHENTICATION & DATA LOADING ---
        async function handleLogin(e) {
            e.preventDefault();
            const pwdInput = document.getElementById('masterPassword').value;
            const errorMsg = document.getElementById('passwordError');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            
            if(!pwdInput) return;

            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                
                if (storedData) {
                    const encryptedObj = JSON.parse(storedData);
                    notes = await cryptoUtils.decryptData(encryptedObj, pwdInput);
                } else {
                    notes = [];
                    await cryptoUtils.encryptData(notes, pwdInput); 
                }

                masterPassword = pwdInput;
                document.getElementById('modalBackdrop').classList.add('hidden');
                
                notes.sort((a, b) => b.updatedAt - a.updatedAt);
                
                updateKnownTags();
                updateFilterDropdown();
                renderNotesList();
                showToast('System decrypted successfully', 'success');

            } catch (err) {
                console.error("Decryption failed:", err);
                errorMsg.classList.remove('hidden');
                document.getElementById('masterPassword').value = '';
            } finally {
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        }

        // --- CORE LOGIC ---
        async function saveToStorage() {
            if (!masterPassword) return;
            isSaving = true;
            updateSaveUI('saving');
            
            try {
                const encryptedObj = await cryptoUtils.encryptData(notes, masterPassword);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(encryptedObj));
                updateSaveUI('saved');
            } catch (error) {
                console.error("Failed to save:", error);
                showToast('Encryption fault during save!', 'error');
                updateSaveUI('error');
            } finally {
                isSaving = false;
            }
        }

        function scheduleSave() {
            if (!activeNoteId) return;
            
            updateSaveUI('editing');
            
            const noteIndex = notes.findIndex(n => n.id === activeNoteId);
            if(noteIndex > -1) {
                notes[noteIndex].title = document.getElementById('noteTitle').value || 'Unnamed Trace';
                notes[noteIndex].content = document.getElementById('noteContent').value;
                notes[noteIndex].updatedAt = Date.now();
                
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    saveToStorage();
                    renderNotesList(false);
                }, 1000);
            }
        }

        function updateSaveUI(state) {
            const statusEl = document.getElementById('saveStatus');
            if (state === 'editing') {
                statusEl.innerHTML = '<i class="fas fa-circle-notch fa-spin text-blue-400"></i> <span class="text-blue-400">Syncing...</span>';
            } else if (state === 'saving') {
                statusEl.innerHTML = '<i class="fas fa-lock text-purple-400 drop-shadow-[0_0_5px_rgba(192,132,252,0.5)]"></i> <span class="text-purple-400">Encrypting...</span>';
            } else if (state === 'saved') {
                statusEl.innerHTML = '<i class="fas fa-check-circle text-green-400 drop-shadow-[0_0_5px_rgba(74,222,128,0.5)]"></i> <span class="text-green-400">Secured</span>';
            } else if (state === 'error') {
                statusEl.innerHTML = '<i class="fas fa-exclamation-triangle text-red-500 drop-shadow-[0_0_5px_rgba(239,68,68,0.5)]"></i> <span class="text-red-500">Fault</span>';
            }
        }

        // --- CRUD OPERATIONS ---
        function createNewNote() {
            const newNote = {
                id: crypto.randomUUID ? crypto.randomUUID() : 'id_' + Date.now(),
                title: '',
                content: '',
                tags: [],
                importance: 2,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            
            notes.unshift(newNote);
            saveToStorage();
            
            document.getElementById('searchInput').value = '';
            document.getElementById('filterCategory').value = '';
            
            renderNotesList();
            openNote(newNote.id);
        }

        function deleteActiveNote() {
            if (!activeNoteId) return;
            showConfirmModal('Delete Trace', 'Irreversible action: This will purge the encrypted record permanently.', () => {
                notes = notes.filter(n => n.id !== activeNoteId);
                activeNoteId = null;
                updateKnownTags();
                updateFilterDropdown();
                saveToStorage();
                renderNotesList();
                showEmptyState();
                closeMobileEditor();
                showToast('Record purged successfully');
            });
        }

        function confirmWipe() {
            showConfirmModal('System Purge', 'CRITICAL WARNING: This will permanently eradicate ALL encrypted traces from local storage. Cannot be undone.', () => {
                notes = [];
                activeNoteId = null;
                localStorage.removeItem(STORAGE_KEY);
                renderNotesList();
                showEmptyState();
                closeMobileEditor();
                showToast('System data obliterated.', 'error');
                
                setTimeout(() => { location.reload(); }, 2000);
            });
        }

        // --- TAGS & IMPORTANCE ---
        function updateKnownTags() {
            const tagSet = new Set(DEFAULT_CATEGORIES);
            notes.forEach(note => {
                if(note.tags) note.tags.forEach(t => tagSet.add(t));
            });
            allKnownTags = Array.from(tagSet).sort();
        }

        function updateFilterDropdown() {
            const filterEl = document.getElementById('filterCategory');
            const currentVal = filterEl.value;
            filterEl.innerHTML = '<option value="">All Tags</option>';
            allKnownTags.forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag;
                opt.innerText = tag.charAt(0).toUpperCase() + tag.slice(1);
                filterEl.appendChild(opt);
            });
            filterEl.value = currentVal;
        }

        function buildTagsUI() {
            const container = document.getElementById('tagsContainer');
            container.innerHTML = '';
            
            allKnownTags.forEach(tag => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = `
                    <input type="checkbox" id="tag_${tag}" class="hidden tag-checkbox" value="${tag}" onchange="toggleTag('${tag}')">
                    <label for="tag_${tag}" class="cursor-pointer inline-block px-4 py-1.5 rounded-full bg-[#1a103c] border border-[#2a1a5c] text-xs font-semibold text-gray-400 hover:bg-[#251754] hover:text-gray-200 transition-all uppercase tracking-wider shadow-sm">
                        ${tag}
                    </label>
                `;
                container.appendChild(wrapper);
            });

            // Add Custom Tag Button
            const addBtnWrapper = document.createElement('div');
            addBtnWrapper.className = "flex items-center gap-2 ml-1";
            addBtnWrapper.innerHTML = `
                <input type="text" id="newTagInput" placeholder="New tag..." class="px-4 py-1.5 text-xs bg-[#0a0616] text-white border border-[#2a1a5c] rounded-full w-28 hidden focus:outline-none focus:border-fuchsia-500 shadow-[0_0_10px_rgba(217,70,239,0.2)] transition-all uppercase tracking-wider">
                <button onclick="promptNewTag()" id="newTagBtn" class="inline-block w-8 h-8 rounded-full bg-[#1a103c] border border-dashed border-[#4a2f9c] text-gray-400 hover:text-fuchsia-400 hover:border-fuchsia-500 transition-all flex items-center justify-center tooltip shadow-sm" title="Add custom tag">
                    <i class="fas fa-plus text-xs"></i>
                </button>
            `;
            container.appendChild(addBtnWrapper);

            if(activeNoteId) {
                const note = notes.find(n => n.id === activeNoteId);
                if(note) {
                    allKnownTags.forEach(tag => {
                        const cb = document.getElementById(`tag_${tag}`);
                        if(cb) cb.checked = note.tags.includes(tag);
                    });
                }
            }
        }

        function promptNewTag() {
            const input = document.getElementById('newTagInput');
            const btn = document.getElementById('newTagBtn');
            
            if(input.classList.contains('hidden')) {
                input.classList.remove('hidden');
                btn.innerHTML = '<i class="fas fa-check text-xs"></i>';
                btn.classList.replace('text-gray-400', 'text-green-400');
                btn.classList.replace('border-[#4a2f9c]', 'border-green-400');
                btn.classList.replace('border-dashed', 'border-solid');
                input.focus();
                
                input.onkeydown = (e) => {
                    if(e.key === 'Enter') confirmNewTag(input.value);
                    if(e.key === 'Escape') cancelNewTag();
                };
            } else {
                confirmNewTag(input.value);
            }
        }

        function confirmNewTag(val) {
            const tag = val.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            if(tag && !allKnownTags.includes(tag)) {
                allKnownTags.push(tag);
                updateFilterDropdown();
                buildTagsUI();
                
                const cb = document.getElementById(`tag_${tag}`);
                if(cb) {
                    cb.checked = true;
                    toggleTag(tag);
                }
            } else if (tag && allKnownTags.includes(tag)) {
                 const cb = document.getElementById(`tag_${tag}`);
                 if(cb && !cb.checked) {
                     cb.checked = true;
                     toggleTag(tag);
                 }
            }
            cancelNewTag();
        }

        function cancelNewTag() {
            const input = document.getElementById('newTagInput');
            const btn = document.getElementById('newTagBtn');
            if(input) {
                input.value = '';
                input.classList.add('hidden');
            }
            if(btn) {
                btn.innerHTML = '<i class="fas fa-plus text-xs"></i>';
                btn.classList.replace('text-green-400', 'text-gray-400');
                btn.classList.replace('border-green-400', 'border-[#4a2f9c]');
                btn.classList.replace('border-solid', 'border-dashed');
            }
        }

        function toggleTag(tag) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if(!note) return;

            const checkbox = document.getElementById(`tag_${tag}`);
            if (checkbox.checked) {
                if(!note.tags.includes(tag)) note.tags.push(tag);
            } else {
                note.tags = note.tags.filter(t => t !== tag);
            }
            note.updatedAt = Date.now();
            saveToStorage();
            updateKnownTags();
            updateFilterDropdown();
            renderNotesList(false);
        }

        function setImportance(level) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if(!note) return;

            note.importance = level;
            note.updatedAt = Date.now();
            updateImportanceUI(level);
            saveToStorage();
            renderNotesList(false);
        }

        function updateImportanceUI(level) {
            [1,2,3].forEach(l => {
                const btn = document.getElementById(`btnImp${l}`);
                btn.className = "px-4 py-1.5 rounded-lg text-gray-500 bg-transparent hover:text-white hover:bg-white/5 transition-all text-xs font-bold tracking-wide"; 
                if(l === level) {
                    if(l===1) btn.className = "px-4 py-1.5 rounded-lg text-white bg-blue-600 shadow-[0_0_15px_rgba(37,99,235,0.6)] transition-all text-xs font-bold tracking-wide";
                    if(l===2) btn.className = "px-4 py-1.5 rounded-lg text-white bg-purple-600 shadow-[0_0_15px_rgba(147,51,234,0.6)] transition-all text-xs font-bold tracking-wide";
                    if(l===3) btn.className = "px-4 py-1.5 rounded-lg text-white bg-pink-600 shadow-[0_0_15px_rgba(219,39,119,0.6)] transition-all text-xs font-bold tracking-wide";
                }
            });
        }

        // --- RENDER LOGIC ---
        function renderNotesList(resetScroll = true) {
            const listEl = document.getElementById('notesList');
            const searchQ = document.getElementById('searchInput').value.toLowerCase();
            const filterTag = document.getElementById('filterCategory').value;
            const sortVal = document.getElementById('sortOrder').value;
            
            const prevScroll = listEl.scrollTop;
            listEl.innerHTML = '';

            const filteredNotes = notes.filter(note => {
                const matchesSearch = note.title.toLowerCase().includes(searchQ) || note.content.toLowerCase().includes(searchQ);
                const matchesTag = filterTag ? note.tags.includes(filterTag) : true;
                return matchesSearch && matchesTag;
            });

            filteredNotes.sort((a, b) => {
                if (sortVal === 'date-desc') return b.updatedAt - a.updatedAt;
                if (sortVal === 'date-asc') return a.updatedAt - b.updatedAt;
                if (sortVal === 'priority-desc') {
                    if (b.importance === a.importance) return b.updatedAt - a.updatedAt;
                    return b.importance - a.importance;
                }
                if (sortVal === 'priority-asc') {
                    if (a.importance === b.importance) return b.updatedAt - a.updatedAt;
                    return a.importance - b.importance;
                }
                return 0;
            });

            if (filteredNotes.length === 0) {
                listEl.innerHTML = `<div class="p-10 text-center text-gray-500 text-sm border border-dashed border-[#2a1a5c] rounded-2xl mx-2 bg-[#0a0616]">No traces found.</div>`;
                return;
            }

            filteredNotes.forEach(note => {
                const isActive = note.id === activeNoteId;
                // Format relative time (e.g. 2h ago) or short date for dashboard vibe
                const dateObj = new Date(note.updatedAt);
                let dateStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if(Date.now() - note.updatedAt > 86400000) {
                    dateStr = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                }
                
                let excerpt = note.content.substring(0, 50).replace(/\n/g, ' ');
                if(note.content.length > 50) excerpt += '...';
                if(!excerpt) excerpt = 'No data recorded...';

                // Importance color glow indicators
                let glowClass = 'bg-gray-600 shadow-[0_0_8px_rgba(156,163,175,0.5)]';
                if(note.importance === 1) glowClass = 'bg-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.8)]';
                if(note.importance === 3) glowClass = 'bg-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.8)]';
                if(note.importance === 2) glowClass = 'bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,0.8)]';

                const div = document.createElement('div');
                
                // Active vs Inactive Card styling
                let baseClasses = "p-5 cursor-pointer rounded-2xl transition-all relative overflow-hidden group ";
                if (isActive) {
                    baseClasses += "bg-[#180e33] border border-fuchsia-500/50 shadow-[0_0_20px_rgba(217,70,239,0.15)]";
                } else {
                    baseClasses += "bg-[#0a0616] border border-[#2a1a5c] hover:border-[#4a2f9c] hover:bg-[#110a26]";
                }
                
                div.className = baseClasses;
                div.onclick = () => openNote(note.id);
                
                let tagsHtml = note.tags.slice(0,3).map(t => `<span class="text-[9px] uppercase tracking-wider bg-[#1a103c] text-fuchsia-300 border border-fuchsia-500/30 px-2 py-1 rounded-md shadow-sm">${t}</span>`).join('');
                if(note.tags.length > 3) tagsHtml += `<span class="text-[10px] text-gray-500 font-bold ml-1">+${note.tags.length - 3}</span>`;

                div.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1 ${note.importance===3 ? 'bg-pink-500/50' : (note.importance===1 ? 'bg-blue-500/50' : 'bg-transparent')}"></div>
                    <div class="flex justify-between items-start mb-2 pl-2">
                        <h3 class="font-bold font-heading text-gray-100 truncate pr-3 text-lg ${!note.title ? 'text-gray-500 italic' : ''}">${note.title || 'Unnamed Trace'}</h3>
                        <div class="w-2.5 h-2.5 rounded-full ${glowClass} mt-1.5 flex-shrink-0"></div>
                    </div>
                    <p class="text-sm text-gray-400 mb-4 truncate pl-2 font-light">${excerpt}</p>
                    <div class="flex justify-between items-center pl-2">
                        <div class="flex gap-1.5 overflow-hidden">${tagsHtml}</div>
                        <span class="text-[11px] font-mono text-gray-500 flex-shrink-0 bg-[#05020a] px-2 py-1 rounded-md border border-[#2a1a5c]">${dateStr}</span>
                    </div>
                `;
                listEl.appendChild(div);
            });

            if (!resetScroll) listEl.scrollTop = prevScroll;
        }

        function openNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;

            activeNoteId = id;
            
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('activeEditor').classList.remove('hidden');
            
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('editorPanel').classList.remove('hidden');
                document.getElementById('editorPanel').classList.add('flex');
            }

            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            
            const created = new Date(note.createdAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
            document.getElementById('noteDates').innerHTML = `<i class="far fa-clock text-blue-400"></i> ${created}`;

            buildTagsUI();
            updateImportanceUI(note.importance || 2);
            updateSaveUI('saved');
            renderNotesList(false);
        }

        function showEmptyState() {
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('activeEditor').classList.add('hidden');
        }

        function closeMobileEditor() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('editorPanel').classList.add('hidden');
            document.getElementById('editorPanel').classList.remove('flex');
            activeNoteId = null;
            renderNotesList(false);
        }

        // --- IMPORT & EXPORT (JSON) ---
        function exportData() {
            const storedData = localStorage.getItem(STORAGE_KEY);
            if(!storedData) {
                showToast("No secure data available to export.", "info");
                return;
            }
            
            const blob = new Blob([storedData], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `Notez_Secure_Core_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast("Encrypted core exported.", "success");
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedEncrypted = JSON.parse(e.target.result);
                    
                    if(!importedEncrypted.salt || !importedEncrypted.iv || !importedEncrypted.data) {
                         throw new Error("Invalid structure");
                    }
                    
                    if(!masterPassword) {
                        showToast("System locked. Authenticate to import.", "error");
                        return;
                    }

                    let importedNotes = [];
                    try {
                        importedNotes = await cryptoUtils.decryptData(importedEncrypted, masterPassword);
                    } catch(decErr) {
                        showToast("Decryption failed. Key mismatch?", "error");
                        return;
                    }
                    
                    showConfirmModal('Integrate Data', `Merge ${importedNotes.length} traces into current dashboard?`, () => {
                        const existingIds = new Set(notes.map(n => n.id));
                        let added = 0;
                        importedNotes.forEach(note => {
                            if(!existingIds.has(note.id)) {
                                notes.push(note);
                                added++;
                            }
                        });
                        
                        notes.sort((a, b) => b.updatedAt - a.updatedAt);
                        updateKnownTags();
                        updateFilterDropdown();
                        saveToStorage();
                        renderNotesList();
                        
                        showToast(`Integration complete: ${added} traces added.`, "success");
                        event.target.value = '';
                    });

                } catch(err) {
                    console.error(err);
                    showToast("Corrupted or invalid core file.", "error");
                }
            };
            reader.readAsText(file);
        }

        // --- UTILS & MODALS ---
        function showConfirmModal(title, desc, onConfirm) {
            const bd = document.getElementById('modalBackdrop');
            const md = document.getElementById('confirmModal');
            const pwd = document.getElementById('passwordModal');
            
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmDesc').innerText = desc;
            
            pwd.classList.add('hidden');
            bd.classList.remove('hidden');
            md.classList.remove('hidden');

            const btnConfirm = document.getElementById('confirmAction');
            const btnCancel = document.getElementById('confirmCancel');
            
            const newConfirm = btnConfirm.cloneNode(true);
            const newCancel = btnCancel.cloneNode(true);
            btnConfirm.parentNode.replaceChild(newConfirm, btnConfirm);
            btnCancel.parentNode.replaceChild(newCancel, btnCancel);

            newCancel.onclick = () => {
                md.classList.add('hidden');
                bd.classList.add('hidden');
            };

            newConfirm.onclick = () => {
                onConfirm();
                md.classList.add('hidden');
                bd.classList.add('hidden');
            };
        }

        let toastTimeout;
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const iconContainer = document.getElementById('toastIconContainer');
            
            document.getElementById('toastMsg').innerText = msg;
            
            // Reset styles
            toast.className = `fixed bottom-6 right-6 bg-[#110a26] border px-6 py-4 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] transform transition-all duration-300 z-50 flex items-center gap-4 min-w-[300px]`;
            iconContainer.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-[#1a103c]';
            
            if(type === 'success') {
                toast.classList.add('border-green-500/50', 'shadow-[0_0_20px_rgba(34,197,94,0.15)]');
                icon.className = 'fas fa-check text-green-400 drop-shadow-[0_0_5px_rgba(74,222,128,0.8)]';
            } else if (type === 'error') {
                toast.classList.add('border-red-500/50', 'shadow-[0_0_20px_rgba(239,68,68,0.15)]');
                icon.className = 'fas fa-exclamation-triangle text-red-500 drop-shadow-[0_0_5px_rgba(239,68,68,0.8)]';
            } else {
                toast.classList.add('border-[#3b2775]');
                icon.className = 'fas fa-info-circle text-blue-400 drop-shadow-[0_0_5px_rgba(96,165,250,0.8)]';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }
    </script>
</body>
